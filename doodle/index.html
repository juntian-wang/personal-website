<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>涂鸦 · Jon's Lab</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/700.css">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  img { display: block; max-width: 100%; }

  /* ===== 顶部栏 ===== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 2rem;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav-home {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    transition: color 0.2s ease;
  }
  .nav-home:hover { color: #fff; }
  .nav-home svg { width: 15px; height: 15px; }
  .nav-tag {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
  }

  /* ===== 图集标题 ===== */
  .gallery-head {
    padding: 3.5rem 2rem 2rem;
    text-align: center;
  }
  .gallery-head h1 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.35) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .gallery-head p {
    margin-top: 0.6rem;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  /* ===== 关于这件作品 ===== */
  .about {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1rem 2rem 2.5rem;
  }
  .sec-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    margin-bottom: 0.6rem;
  }
  .about-title {
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 1.2rem;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.35) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .about-copy {
    max-width: 680px;
    font-size: 1rem;
    line-height: 2;
    color: rgba(255,255,255,0.72);
  }
  .about-copy p + p { margin-top: 1.2rem; }
  .about-copy strong { color: #fff; font-weight: 600; }
  .about-brief {
    display: flex;
    gap: 4rem;
    align-items: flex-start;
  }
  .about-facts {
    flex-shrink: 0;
    width: 200px;
    border-left: 1px solid rgba(255,255,255,0.1);
    padding-left: 1.6rem;
  }
  .about-facts .bf { margin-bottom: 1.3rem; }
  .about-facts .bf:last-child { margin-bottom: 0; }
  .bf-label {
    display: block;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.3);
    margin-bottom: 0.3rem;
  }
  .bf-value {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    line-height: 1.5;
  }
  @media (max-width: 640px) {
    .about { padding: 0.5rem 1rem 2rem; }
    .about-brief { flex-direction: column; gap: 1.6rem; }
    .about-facts { width: 100%; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); padding-left: 0; padding-top: 1.2rem; }
  }

  /* ===== 图集网格 ===== */
  .doodle-grid {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1rem 2rem 5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.2rem;
  }
  .doodle-grid figure {
    cursor: zoom-in;
    border-radius: 8px;
    overflow: hidden;
    background: #0a0a0a;
  }
  .doodle-grid img {
    width: 100%;
    height: auto;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .doodle-grid figure:hover img { transform: scale(1.03); }

  @media (max-width: 640px) {
    .doodle-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; padding: 0.5rem 1rem 3rem; }
    .gallery-head { padding: 2.5rem 1rem 1.5rem; }
    .nav { padding: 0.9rem 1rem; }
  }

  /* ===== 底部版权 + 社媒 ===== */
  .doodle-footer {
    max-width: 1180px;
    margin: 0 auto;
    padding: 2.2rem 2rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .df-copy { font-size: 0.78rem; color: rgba(255,255,255,0.3); }
  .df-links { display: flex; align-items: center; gap: 1.3rem; }
  .df-links a, .df-links span {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .df-links a:hover { color: #fff; }
  .df-links svg { width: 16px; height: 16px; }
  @media (max-width: 560px) {
    .doodle-footer { justify-content: center; text-align: center; }
    .df-links { gap: 1rem; flex-wrap: wrap; justify-content: center; }
  }

  /* ===== Lightbox 点击放大 ===== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.92);
    cursor: zoom-out;
  }
  .lightbox.is-open { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .lightbox-close {
    position: absolute;
    top: 1.2rem;
    right: 1.4rem;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.7);
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-home" href="https://jonlab.cn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    jonlab.cn
  </a>
  <span class="nav-tag">涂鸦 · DOODLES</span>
</nav>

<header class="gallery-head">
  <h1>涂鸦</h1>
  <p>DOODLES · 随手画的小画</p>
</header>

<section class="about">
  <div class="sec-label">OVERVIEW</div>
  <h2 class="about-title">关于这件作品</h2>
  <div class="about-brief">
    <div class="about-copy">
      <p>这些是<strong>我自己画的涂鸦</strong>——上课走神、等人无聊、灵感冒头的时候，随手记下来的小画。没有严格的构图，也没有统一的主题，就是想画就画。</p>
      <p>每一张都对应一个当时的心情：有的画完很满意，有的画完自己都笑了。手绘的快乐，大概就是这样。</p>
    </div>
    <aside class="about-facts">
      <div class="bf"><span class="bf-label">MEDIUM</span><span class="bf-value">手绘</span></div>
      <div class="bf"><span class="bf-label">STYLE</span><span class="bf-value">自由涂鸦 · 无主题</span></div>
      <div class="bf"><span class="bf-label">YEAR</span><span class="bf-value">2026</span></div>
    </aside>
  </div>
</section>

<main class="doodle-grid" id="grid"></main>

<footer class="doodle-footer">
  <div class="df-copy">© 2026 Jon's Lab. All rights reserved.</div>
  <div class="df-links">
    <a href="https://space.bilibili.com/1551587375" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M7 7L5.5 4M17 7l1.5-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="8" y="11" width="8" height="5" rx="1.5" stroke="currentColor" stroke-width="1.2"/></svg>
      bilibili
    </a>
    <a href="https://www.xiaohongshu.com/user/profile/62c7adc9000000000e00cbd3" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/><path d="M8 9.5h8M8 13h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      小红书
    </a>
    <span>
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/><path d="M7 12c0-2 2-3 3-2l2 4 2-4c1-1 3 0 3 2s-2 3-3 2l-2-4-2 4c-1 1-3 0-3-2z" stroke="currentColor" stroke-width="1.2"/></svg>
      视频号
    </span>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <div class="lightbox-close" id="lbClose">✕</div>
  <img id="lbImg" src="" alt="" />
</div>

<script>
  var TOTAL = 24;
  var grid = document.getElementById('grid');
  for (var i = 1; i <= TOTAL; i++) {
    var fig = document.createElement('figure');
    var img = document.createElement('img');
    var n = i < 10 ? '0' + i : i;
    img.src = 'assets/doodle-' + n + '.webp';
    img.alt = '涂鸦 · ' + n;
    img.loading = 'lazy';
    img.addEventListener('click', function () {
      document.getElementById('lbImg').src = this.src;
      document.getElementById('lightbox').classList.add('is-open');
    });
    fig.appendChild(img);
    grid.appendChild(fig);
  }

  // Lightbox 关闭
  var lb = document.getElementById('lightbox');
  function closeLb() { lb.classList.remove('is-open'); }
  lb.addEventListener('click', closeLb);
  document.getElementById('lbClose').addEventListener('click', function (e) { e.stopPropagation(); closeLb(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
</script>

</body>
</html>
