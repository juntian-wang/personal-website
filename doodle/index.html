<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>涂鸦 · Jon's Lab</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/700.css">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    font-weight: 500;
    background: #000;
    color: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  img { display: block; }

  /* ===== 背景大字（复刻 gregor c-gregor） ===== */
  .bg-word {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(4rem, 22vw, 18rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1;
    white-space: nowrap;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,0.07);
    pointer-events: none;
    user-select: none;
    z-index: -1;
    opacity: 0;
    transition: opacity 1.2s ease 0.3s;
  }
  body.has-loaded .bg-word { opacity: 1; }

  /* ===== 图库容器：5 列 Z 字错落 ===== */
  .gallery {
    max-width: 100vw;
    padding: 2rem 3rem 8rem;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    column-gap: 2.4rem;
    row-gap: 6rem;
    align-items: start;
  }

  .g-item {
    position: relative;
    cursor: zoom-in;
    opacity: 0;
    /* FLIP 从中心展开：位移+渐显 */
    transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease;
  }
  .loading .g-item {
    opacity: 0 !important;
    transform: translate(var(--dx, 0px), var(--dy, 0px)) !important;
  }
  .g-item .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    overflow: visible;
  }
  .g-item .thumb img {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    border-radius: 3px;
  }
  .g-item:hover .thumb img { transform: translate(-50%, -50%) scale(1.04); }

  /* 加载后：图片从中心飞到各自位置（纯位移+渐显，和原站一致） */
  body.has-loaded .g-item { opacity: 1; transform: none; transition-delay: var(--delay, 0s); }
  body.has-loaded .g-item:nth-child(5n+2),
  body.has-loaded .g-item:nth-child(5n+4) { transform: translateY(calc(50% + 3rem)); }
  /* 底部文字同时出现 */
  body.has-loaded .view-switch button { transform: none; opacity: 1; filter: blur(0); }
  body.has-loaded .back-nav { animation: fadeUp 0.6s 0.5s ease forwards; opacity: 0; }
  body.has-loaded .doodle-footer { animation: fadeUp 0.6s 0.7s ease forwards; opacity: 0; }
  @keyframes fadeUp { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .g-item { opacity: 1; transform: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
    .bg-word { opacity: 1; transition: none; }
    .back-nav, .doodle-footer { opacity: 1; animation: none; }
  }

  /* List 模式的文字（Grid 下隐藏） */
  .list-info { display: none; font-size: 0.7rem; color: rgba(255,255,255,0.3); text-align: center; margin-top: 0.4rem; letter-spacing: 0.1em; }

  /* ===== List 模式 ===== */
  .gallery.list-mode {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 2rem 2rem 8rem;
  }
  .gallery.list-mode .g-item { cursor: zoom-in; opacity: 1; transition: opacity 0.2s; }
  .gallery.list-mode .g-item:nth-child(5n+2),
  .gallery.list-mode .g-item:nth-child(5n+4) { transform: none; }
  .gallery.list-mode .g-item {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    padding: 0.7rem 0.6rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    transition: background 0.2s;
  }
  .gallery.list-mode .g-item:hover { background: rgba(255,255,255,0.04); }
  .gallery.list-mode .g-item .thumb {
    width: 80px;
    height: 80px;
    flex-shrink: 0;
    aspect-ratio: auto;
  }
  .gallery.list-mode .g-item .thumb img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    border-radius: 3px;
    position: static;
    transform: none;
  }
  .gallery.list-mode .list-info { display: block; margin-top: 0; flex: 1; text-align: left; font-size: 0.82rem; color: rgba(255,255,255,0.6); }
  .gallery.list-mode .g-item:hover .list-info { color: #fff; }

  /* ===== Grid / List 切换（底部） ===== */
  .view-switch {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1.5rem 2rem 0.5rem;
    display: flex;
    justify-content: flex-end;
    gap: 1.2rem;
    perspective: 600px;
  }
  .view-switch button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.4);
    padding: 0.2rem 0;
    cursor: pointer;
    transform-style: preserve-3d;
    transform: translateY(50%) rotateX(-30deg);
    opacity: 0;
    filter: blur(6px);
    transition: opacity 0.49s ease, filter 0.49s ease, transform 0.49s ease, color 0.2s, border-color 0.2s;
  }
  .view-switch button:nth-child(2) { transition-delay: 0.04s; }
  .view-switch button.active,
  .view-switch button:hover { border-bottom-color: rgba(255,255,255,0.6); color: #fff; }

  /* ===== 底部导航 ===== */
  .back-nav {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .back-nav a, .back-nav button {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: none;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 0.8rem 1.5rem;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    transition: all 0.25s;
  }
  .back-nav a:hover, .back-nav button:hover { color: #fff; border-color: rgba(255,255,255,0.45); }
  .back-nav svg { width: 15px; height: 15px; }

  /* ===== 版权 + 社媒 ===== */
  .doodle-footer {
    max-width: 1180px;
    margin: 0 auto;
    padding: 2.2rem 2rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .df-copy { font-size: 0.78rem; color: rgba(255,255,255,0.3); }
  .df-links { display: flex; align-items: center; gap: 1.3rem; }
  .df-links a, .df-links span {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.45);
    transition: color 0.2s;
  }
  .df-links a:hover { color: #fff; }
  .df-links svg { width: 16px; height: 16px; }

  /* ===== Lightbox ===== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.93);
    cursor: zoom-out;
  }
  .lightbox.is-open { display: flex; }
  .lb-stage { position: relative; display: flex; align-items: center; justify-content: center; }
  .lightbox img {
    max-width: 88vw;
    max-height: 84vh;
    border-radius: 4px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .lb-top {
    position: absolute;
    top: 1.2rem;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.6rem;
    pointer-events: none;
  }
  .lb-count {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    color: rgba(255,255,255,0.45);
  }
  .lb-close {
    pointer-events: auto;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.7);
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lb-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .lb-caption {
    position: absolute;
    bottom: 1.4rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.55);
    white-space: nowrap;
  }
  .lb-nav {
    pointer-events: auto;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(0,0,0,0.3);
    color: rgba(255,255,255,0.75);
    font-size: 1.3rem;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .lb-nav:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .lb-prev { left: 1.4rem; }
  .lb-next { right: 1.4rem; }

  /* ===== 响应式 ===== */
  @media (max-width: 1024px) {
    .gallery { grid-template-columns: repeat(3, 1fr); }
    /* 桌面 5 列错落规则撤销 */
    body.has-loaded .g-item:nth-child(5n+2),
    body.has-loaded .g-item:nth-child(5n+4) { transform: none; }
    /* 3 列错落：第 2 列下移 */
    body.has-loaded .g-item:nth-child(3n+2) { transform: translateY(calc(50% + 2rem)); }
  }
  @media (max-width: 640px) {
    .bg-word { font-size: clamp(3rem, 30vw, 10rem); }
    .gallery { grid-template-columns: repeat(2, 1fr); column-gap: 1rem; row-gap: 2rem; padding: 1.5rem 1rem 4rem; }
    body.has-loaded .g-item:nth-child(3n+2) { transform: none; }
    body.has-loaded .g-item:nth-child(2n) { transform: translateY(1.2rem); }
    .gallery.list-mode { padding: 1.5rem 1rem 4rem; }
    .gallery.list-mode .g-item:nth-child(2n) { transform: none; }
    .lb-prev { left: 0.8rem; }
    .lb-next { right: 0.8rem; }
    .lightbox img { max-width: 92vw; }
    .view-switch { justify-content: center; padding: 1rem 1rem 0.5rem; }
  }
  @media (max-width: 560px) {
    .back-nav { padding: 3rem 1.3rem 1.5rem; }
    .doodle-footer { justify-content: center; text-align: center; }
    .df-links { gap: 1rem; flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body class="loading">
<noscript><style>.loading .g-item{opacity:1!important;transform:none!important;filter:none!important}.loading .bg-word,.loading .view-switch button,.loading .back-nav,.loading .doodle-footer{opacity:1!important;transform:none!important;filter:none!important;animation:none!important}</style></noscript>

<div class="bg-word">Jon's lab</div>

<div class="gallery" id="gallery"></div>

<div class="view-switch" id="viewSwitch">
  <button type="button" id="btnGrid" class="active" onclick="setView('grid')">Grid</button>
  <button type="button" id="btnList" onclick="setView('list')">List</button>
</div>

<nav class="back-nav">
  <a href="https://jonlab.cn/?from=detail#portfolio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回作品集
  </a>
  <button type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    回到顶部
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
</nav>

<footer class="doodle-footer">
  <div class="df-copy">© 2026 Jon's Lab. All rights reserved.</div>
  <div class="df-links">
    <a href="https://space.bilibili.com/1551587375" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M7 7L5.5 4M17 7l1.5-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="8" y="11" width="8" height="5" rx="1.5" stroke="currentColor" stroke-width="1.2"/></svg>
      bilibili
    </a>
    <a href="https://www.xiaohongshu.com/user/profile/62c7adc9000000000e00cbd3" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/><path d="M8 9.5h8M8 13h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      小红书
    </a>
    <span>
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/><path d="M7 12c0-2 2-3 3-2l2 4 2-4c1-1 3 0 3 2s-2 3-3 2l-2-4-2 4c-1 1-3 0-3-2z" stroke="currentColor" stroke-width="1.2"/></svg>
      视频号
    </span>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <div class="lb-top">
    <span class="lb-count" id="lbCount">01 / 27</span>
    <div class="lb-close" id="lbClose">✕</div>
  </div>
  <div class="lb-stage">
    <div class="lb-nav lb-prev" id="lbPrev">‹</div>
    <img id="lbImg" src="" alt="" />
    <div class="lb-nav lb-next" id="lbNext">›</div>
  </div>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script>
  var TOTAL = 27;
  // 两份循环，首尾相连
  var CYCLES = 2;
  var ITEMS = [];
  for (var i = 1; i <= TOTAL; i++) {
    var n = i < 10 ? '0' + i : i;
    ITEMS.push({ src: 'assets/doodle-' + n + '.webp', name: 'doodle-' + n + '.webp', fig: n });
  }

  // ===== 渲染（两份循环 + FLIP 从中心展开） =====
  var gallery = document.getElementById('gallery');
  for (var c = 0; c < CYCLES; c++) {
    ITEMS.forEach(function (item, idx) {
      var d = document.createElement('div');
      d.className = 'g-item';
      d.innerHTML =
        '<div class="thumb"><img loading="lazy" alt=""></div>' +
        '<div class="list-info">FIG. ' + (idx < 9 ? '0' + (idx + 1) : idx + 1) + ' &middot; ' + item.name + '</div>';
      d.querySelector('img').src = item.src;
      d.querySelector('img').alt = '涂鸦 · ' + item.fig;
      d.addEventListener('click', function () { openLb(idx); });
      gallery.appendChild(d);
    });
  }

  // ===== FLIP：计算每张图从中心飞到目标位置的偏移 =====
  requestAnimationFrame(function () {
    var all = gallery.querySelectorAll('.g-item');
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    all.forEach(function (el, i) {
      var r = el.getBoundingClientRect();
      var dx = (cx - (r.left + r.width / 2)).toFixed(1);
      var dy = (cy - (r.top + r.height / 2)).toFixed(1);
      el.style.setProperty('--dx', dx + 'px');
      el.style.setProperty('--dy', dy + 'px');
      el.style.setProperty('--delay', (i * 0.018).toFixed(3) + 's');
    });
    // 图片已设置偏移 → 触发飞行动画
    document.body.classList.replace('loading', 'has-loaded');
  });

  // ===== 滚动渐入（IntersectionObserver） =====
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); }
    });
  }, { threshold: 0.04, rootMargin: '0px 0px 40px 0px' });
  document.querySelectorAll('.g-item').forEach(function (el) { io.observe(el); });

  // ===== Grid / List 切换 =====
  function setView(mode) {
    gallery.classList.toggle('list-mode', mode === 'list');
    document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
    document.getElementById('btnList').classList.toggle('active', mode === 'list');
  }

  // ===== 灯箱（索引按 27 张循环） =====
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCount = document.getElementById('lbCount');
  var lbCaption = document.getElementById('lbCaption');
  var cur = 0;

  function openLb(idx) {
    cur = idx % TOTAL;
    updateLb();
    lb.classList.add('is-open');
  }
  function closeLb() { lb.classList.remove('is-open'); }
  function stepLb(dir) {
    cur = (cur + dir + TOTAL) % TOTAL;
    updateLb();
  }
  function updateLb() {
    lbImg.src = ITEMS[cur].src;
    lbCount.textContent = (cur < 9 ? '0' + (cur + 1) : cur + 1) + ' / ' + TOTAL;
    lbCaption.textContent = '涂鸦 · ' + ITEMS[cur].fig;
  }

  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
  document.getElementById('lbClose').addEventListener('click', function (e) { e.stopPropagation(); closeLb(); });
  document.getElementById('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); stepLb(-1); });
  document.getElementById('lbNext').addEventListener('click', function (e) { e.stopPropagation(); stepLb(1); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('is-open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') stepLb(-1);
    if (e.key === 'ArrowRight') stepLb(1);
  });
</script>

</body>
</html>
