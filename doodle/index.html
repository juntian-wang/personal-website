<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>涂鸦 · Jon's Lab</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/700.css">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  img { display: block; max-width: 100%; }

  /* ===== 顶部栏 ===== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 2rem;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .nav-home {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    transition: color 0.2s ease;
  }
  .nav-home:hover { color: #fff; }
  .nav-home svg { width: 15px; height: 15px; }
  .nav-tag {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
  }

  /* ===== 图集标题 ===== */
  .gallery-head {
    padding: 3.5rem 2rem 2rem;
    text-align: center;
  }
  .gallery-head h1 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.35) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .gallery-head p {
    margin-top: 0.6rem;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  /* ===== 图集网格 ===== */
  .doodle-grid {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1rem 2rem 5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.2rem;
  }
  .doodle-grid figure {
    cursor: zoom-in;
    border-radius: 8px;
    overflow: hidden;
    background: #0a0a0a;
  }
  .doodle-grid img {
    width: 100%;
    height: auto;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .doodle-grid figure:hover img { transform: scale(1.03); }

  @media (max-width: 640px) {
    .doodle-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; padding: 0.5rem 1rem 3rem; }
    .gallery-head { padding: 2.5rem 1rem 1.5rem; }
    .nav { padding: 0.9rem 1rem; }
  }

  /* ===== Lightbox 点击放大 ===== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.92);
    cursor: zoom-out;
  }
  .lightbox.is-open { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .lightbox-close {
    position: absolute;
    top: 1.2rem;
    right: 1.4rem;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.7);
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-home" href="https://jonlab.cn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    jonlab.cn
  </a>
  <span class="nav-tag">涂鸦 · DOODLES</span>
</nav>

<header class="gallery-head">
  <h1>涂鸦</h1>
  <p>DOODLES · 随手画的小画</p>
</header>

<main class="doodle-grid" id="grid"></main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-close" id="lbClose">✕</div>
  <img id="lbImg" src="" alt="" />
</div>

<script>
  var TOTAL = 24;
  var grid = document.getElementById('grid');
  for (var i = 1; i <= TOTAL; i++) {
    var fig = document.createElement('figure');
    var img = document.createElement('img');
    var n = i < 10 ? '0' + i : i;
    img.src = 'assets/doodle-' + n + '.webp';
    img.alt = '涂鸦 · ' + n;
    img.loading = 'lazy';
    img.addEventListener('click', function () {
      document.getElementById('lbImg').src = this.src;
      document.getElementById('lightbox').classList.add('is-open');
    });
    fig.appendChild(img);
    grid.appendChild(fig);
  }

  // Lightbox 关闭
  var lb = document.getElementById('lightbox');
  function closeLb() { lb.classList.remove('is-open'); }
  lb.addEventListener('click', closeLb);
  document.getElementById('lbClose').addEventListener('click', function (e) { e.stopPropagation(); closeLb(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
</script>

</body>
</html>
