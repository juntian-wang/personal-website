function buildGallery(containerId, list) {
  const container = document.getElementById(containerId);
  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    let imgHtml = '';
    if (Array.isArray(item.img)) {
      // 多帧 → 创建动画
      if (item.anim) {
        const spd = item.speed || 500;
        const bearAttr = item.bear ? ' data-bear="true"' : '';
        const imgs = item.img.map(src => `<img src="${src}" data-src="${src}" style="display:none">`).join('');
        imgHtml = `<div class="img-wrap" data-frames='${JSON.stringify(item.img)}' data-anim="true" data-speed="${spd}"${bearAttr}>${imgs}</div>`;
      } else {
        imgHtml = `<div class="img-wrap"><img src="${item.img[0]}"></div>`;
      }
    } else {
      imgHtml = `<div class="img-wrap"><img src="${item.img}"></div>`;
    }
    const animDot = item.anim ? '<span class="anim-icon"></span>' : '';
    card.innerHTML = imgHtml + `<div class="name">${animDot}${item.name}</div><div class="sub">${item.note}</div>`;
    container.appendChild(card);
  });
}

buildGallery('item', UNITS.item);

// 启动所有动画（支持不同速度）
document.querySelectorAll('[data-anim="true"]').forEach(wrap => {
  let frames, spd=parseInt(wrap.dataset.speed)||500;
  try { frames = JSON.parse(wrap.dataset.frames); } catch(e) { return; }
  const imgs = wrap.querySelectorAll('img');
  let idx = 0;
  if (imgs.length) imgs[0].style.display = 'block';
  setInterval(() => {
    imgs.forEach(img => {
      img.style.display = 'none';
      img.style.transform = ''; // 清除缩放
    });
    idx = (idx + 1) % imgs.length;
    if (imgs[idx]) {
      imgs[idx].style.display = 'block';
      // 熊奔跑第4/5帧（索引3、4）模拟游戏内放大2倍
      if (wrap.dataset.bear === 'true' && (idx === 3 || idx === 4)) {
        imgs[idx].style.transform = 'scale(1.3)';
      }
    }
  }, spd);
});
