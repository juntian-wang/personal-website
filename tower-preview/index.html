<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>玛雅塔防 · 美术图鉴 · Jon's Lab</title>

<!-- Space Grotesk 西文字体（jsdelivr fontsource，中文自动回退系统字体） -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/space-grotesk@latest/700.css">

<!-- ============================================================
     Jon's Lab 作品详情页 · 通用模板
     ------------------------------------------------------------
     复用方法：只需修改底部 <script> 中的 PROJECT 配置对象，
     页面所有内容（标题 / 文字 / 图片 / 视频 / 3D 模型）由数据驱动渲染。
     支持的内容区块：
       intro     文字介绍（段落数组）
       heroMedia 主视觉（图片或视频）
       gallery   图片画廊（贴纸卡片风格，与首页作品卡一致）
       structure 建筑体系（大图 + 模块标签）
       video     视频区块
       model     3D 模型查看器（glb/gltf，null 则整区块不渲染）
       specs     参数格子
     ============================================================ -->

<style>
  /* ===== Reset ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 巨型描边背景字（区块英文标签放大） ===== */
  .bg-word {
    position: absolute;
    top: 4.2rem;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    text-align: center;
    font-size: clamp(4.5rem, 14vw, 11.5rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,0.095);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    z-index: 0;
  }
  .section > *:not(.bg-word) { position: relative; z-index: 1; }
  img, video { display: block; max-width: 100%; }
  a { color: inherit; }

  /* ===== 渐变标题（与首页 Hero 同款） ===== */
  .grad-text {
    background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ===== 小标签（区块编号 + 分类名） ===== */
  .sec-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }
  .sec-label .sec-num {
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
  }
  .sec-label .sec-num::after {
    content: '';
    display: inline-block;
    width: 2.2rem;
    height: 1px;
    background: rgba(255,255,255,0.18);
    margin-left: 0.9rem;
    vertical-align: middle;
  }
  /* Hero 内的小标签恢复无编号样式 */
  .hero .sec-label .sec-num::after { display: none; }

  /* ===== Nav ===== */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 2rem;
    transition: background 0.35s ease, backdrop-filter 0.35s ease;
  }
  .nav.is-solid {
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .nav-home {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    transition: color 0.2s ease;
  }
  .nav-home:hover { color: #fff; }
  .nav-home svg { width: 15px; height: 15px; }
  .nav-tag {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
  }

  /* ===== Hero（工作室式：左下超大标题） ===== */
  .hero {
    position: relative;
    min-height: 96vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-end;
    text-align: left;
    padding: 7rem 4rem 5.5rem;
    overflow: hidden;
  }
  /* 背后的主视觉图：压暗 + 模糊，做氛围底 */
  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: -1;
    overflow: hidden;
  }
  .hero-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.5;
    filter: saturate(1.05) blur(4px);
    transform: scale(1.12);
  }
  .hero.is-in .hero-bg img { transform: scale(1.04); }
  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.08) 40%, rgba(0,0,0,0.82) 92%);
  }
  .hero-title {
    font-size: clamp(3rem, 8.5vw, 6.6rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.08;
    margin: 0.8rem 0 1.2rem;
  }
  /* 英文副题（标题下方小字） */
  .hero-title-en {
    font-size: clamp(0.8rem, 1.4vw, 1rem);
    font-weight: 500;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin: -0.2rem 0 1.4rem;
  }
  .hero-subtitle {
    font-size: clamp(1rem, 1.8vw, 1.2rem);
    color: rgba(255,255,255,0.62);
    font-weight: 400;
    max-width: 520px;
    line-height: 1.75;
  }
  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    gap: 0.6rem 2.6rem;
    margin-top: 2.8rem;
    padding-top: 1.6rem;
    border-top: 1px solid rgba(255,255,255,0.14);
    width: min(680px, 100%);
  }
  .hero-meta .hm {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.3rem;
  }
  .hero-meta .hm-label {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.42);
  }
  /* Hero 内的小标签可读性增强 */
  .hero .sec-label { color: rgba(255,255,255,0.45); }
  .hero-meta .hm-value {
    font-size: 0.88rem;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
  }
  .hero-scroll {
    position: absolute;
    bottom: 2.5rem;
    right: 4rem;
    width: 1px;
    height: 52px;
    background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent);
    overflow: hidden;
  }
  .hero-scroll::after {
    content: '';
    position: absolute;
    top: -50%;
    left: 0;
    width: 100%;
    height: 50%;
    background: #fff;
    animation: scrollHint 1.8s ease-in-out infinite;
  }
  @keyframes scrollHint {
    0% { top: -50%; } 100% { top: 110%; }
  }

  /* ===== Section 通用 ===== */
  .section {
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    padding: 6.5rem 2rem 1rem;
  }
  .section-title {
    font-size: clamp(2rem, 4.6vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.12;
    margin-bottom: 2.6rem;
  }
  /* 区块标题渐变收实（小字号下保持可读） */
  .section-title.grad-text {
    background-image: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.62) 100%);
  }
  .section-head-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .section-note {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.35);
    margin-bottom: 2.2rem;
  }
  /* 媒体出血：图片/视频比文字栏更宽（1100 → 1240） */
  .wide-media {
    width: min(1240px, calc(100vw - 3rem));
    margin-left: 50%;
    transform: translateX(-50%);
  }

  /* ===== 滚动渐入 ===== */
  .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.75s ease, transform 0.75s ease;
  }
  .reveal.is-visible { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .hero-scroll::after { animation: none; }
    .reveal .sec-label, .reveal .section-title, .reveal .section-note,
    .reveal .g-img img, .reveal .d-img img, .reveal .p-img img,
    .reveal .hero-media img, .reveal .structure-img img, .reveal .v-img img,
    .hero .sec-label, .hero-title, .hero-title-en, .hero-subtitle, .hero-meta {
      opacity: 1 !important; transform: none !important; transition: none !important;
    }
    .hero-bg img { transform: scale(1.04) !important; transition: none !important; }
  }

  /* ===== Intro 文字 ===== */
  .intro-copy {
    max-width: 680px;
    font-size: 1.02rem;
    line-height: 2.05;
    color: rgba(255,255,255,0.72);
  }
  .intro-copy p + p { margin-top: 1.4rem; }
  .intro-copy strong { color: #fff; font-weight: 600; }

  /* ===== 主视觉大图 ===== */
  .hero-media {
    margin-top: 3.2rem;
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .hero-media img { width: 100%; }
  .media-caption {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.3);
    margin-top: 0.9rem;
    text-align: center;
  }

  /* ===== 图集瀑布流（双列错列，图片保持原始比例） ===== */
  .gallery-masonry {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 1.6rem;
    align-items: start;
  }
  .g-col { display: flex; flex-direction: column; gap: 2.4rem; }
  /* 第二列整体下移，形成错列节奏 */
  .g-col:nth-child(2) { margin-top: 3.5rem; }
  .g-item .g-img {
    border-radius: 8px;
    overflow: hidden;
    cursor: zoom-in;
    background: #050505;
  }
  .g-item .g-img img {
    width: 100%;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .g-item .g-img:hover img { transform: scale(1.025); }

  /* ===== 建筑体系 ===== */
  .structure-img {
    border-radius: 10px;
    overflow: hidden;
    cursor: zoom-in;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .module-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.55rem;
    margin-top: 1.8rem;
  }
  .chip {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.65);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 0.4rem 0.95rem;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .chip:hover { border-color: rgba(255,255,255,0.45); color: #fff; }

  /* ===== 视频区块 ===== */
  .video-wrap {
    border-radius: 10px;
    overflow: hidden;
    background: #0a0a0a;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    aspect-ratio: 16 / 9;
  }
  .video-wrap video { width: 100%; height: 100%; object-fit: cover; }

  /* ===== 3D 模型区块 ===== */
  .model-wrap {
    border-radius: 10px;
    overflow: hidden;
    /* 深空星空背景：星点 + 星云 + 深蓝黑渐变 */
    background:
      radial-gradient(ellipse 340px 240px at 22% 32%, rgba(96, 128, 255, 0.10), transparent),
      radial-gradient(ellipse 280px 200px at 80% 70%, rgba(168, 118, 255, 0.08), transparent),
      radial-gradient(1px 1px at 18% 24%, rgba(255,255,255,0.55), transparent),
      radial-gradient(1px 1px at 64% 12%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 38% 55%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 82% 38%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 10% 72%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 52% 82%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 72% 58%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 90% 88%, rgba(255,255,255,0.4), transparent),
      radial-gradient(ellipse at 50% 42%, #101a2e 0%, #060a14 55%, #02040a 100%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .model-wrap model-viewer {
    width: 100%;
    height: 70vh;
    min-height: 420px;
    --poster-color: transparent;
    background: transparent !important;
    background-color: transparent !important;
  }
  .model-hint {
    text-align: center;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.3);
    padding: 0.8rem 0 1.1rem;
  }

  /* ===== Specs 参数格 ===== */
  .specs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    overflow: hidden;
  }
  .spec {
    background: #000;
    padding: 1.6rem 1.4rem;
  }
  .spec-label {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    margin-bottom: 0.55rem;
  }
  .spec-value {
    font-size: 1.05rem;
    font-weight: 600;
    color: rgba(255,255,255,0.88);
    line-height: 1.5;
  }

  /* ===== 底部导航 ===== */
  .bottom-nav {
    max-width: 1100px;
    margin: 0 auto;
    padding: 5rem 2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .bn-link {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 0.8rem 1.5rem;
    transition: all 0.25s ease;
  }
  .bn-link:hover { color: #fff; border-color: rgba(255,255,255,0.45); }
  .bn-link svg { width: 15px; height: 15px; }

  /* ===== Footer（与首页一致） ===== */
  .footer {
    border-top: 1px solid rgba(255,255,255,0.08);
    margin-top: 3rem;
  }
  .footer-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.2rem 2rem 2.6rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .footer-copy {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.35);
  }
  .footer-links {
    display: flex;
    align-items: center;
    gap: 1.4rem;
  }
  .footer-links a, .footer-links span {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .footer-links a:hover { color: #fff; }
  .footer-links svg { width: 17px; height: 17px; }

  /* ===== 图注编号系统（case study 风格） ===== */
  .fig-cap {
    display: flex;
    align-items: baseline;
    gap: 0.8rem;
    margin-top: 0.9rem;
  }
  .fig-num {
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
  }
  .fig-text {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
    line-height: 1.6;
  }

  /* ===== 全幅出血大图 ===== */
  .full-bleed {
    position: relative;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-top: 1rem;
    overflow: hidden;
  }
  .full-bleed .fb-img { cursor: zoom-in; }
  .full-bleed img {
    width: 100%;
    max-height: 90vh;
    object-fit: cover;
  }
  .full-bleed .fig-cap {
    max-width: 1100px;
    margin: 1rem auto 0;
    padding: 0 2rem;
  }
  /* 沉浸版：96vh + 视差 + 叠字 */
  .atmosphere-bleed { height: 96vh; margin-top: 0; }
  .atmosphere-bleed .fb-img { position: absolute; inset: 0; }
  .atmosphere-bleed .fb-img img {
    width: 100%;
    height: 118%;
    max-height: none;
    object-fit: cover;
    will-change: transform;
  }
  .atmosphere-bleed::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 35%, rgba(0,0,0,0.15) 65%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
  }
  .atmo-copy {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }
  .atmo-line {
    font-size: clamp(2.4rem, 7.5vw, 6rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    line-height: 1.1;
  }
  .atmo-sub {
    margin-top: 1.2rem;
    font-size: 0.82rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }
  .atmosphere-bleed .fig-cap {
    position: absolute;
    bottom: 1.6rem;
    left: 0;
    right: 0;
    z-index: 2;
  }

  /* ===== 超大数字展示 ===== */
  .big-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2rem 1.6rem;
    margin-top: 4.5rem;
    padding: 2.8rem 0 0.5rem;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .big-stat .bs-num {
    font-size: clamp(2.6rem, 5.6vw, 4.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .big-stat .bs-label {
    margin-top: 0.75rem;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  /* ===== 编排出场动效 ===== */
  .reveal .sec-label,
  .reveal .section-title,
  .reveal .section-note {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .reveal .section-title { transition-delay: 0.12s; transform: translateY(38px); }
  .reveal.is-visible .sec-label,
  .reveal.is-visible .section-title,
  .reveal.is-visible .section-note { opacity: 1; transform: none; }
  /* 图片缩放揭示 */
  .reveal .g-img img,
  .reveal .d-img img,
  .reveal .p-img img,
  .reveal .hero-media img,
  .reveal .structure-img img,
  .reveal .v-img img {
    transform: scale(1.1);
    transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), filter 0.3s ease;
  }
  .reveal.is-visible .g-img img,
  .reveal.is-visible .d-img img,
  .reveal.is-visible .p-img img,
  .reveal.is-visible .hero-media img,
  .reveal.is-visible .structure-img img,
  .reveal.is-visible .v-img img { transform: scale(1); }

  /* ===== Hero 入场 ===== */
  .hero .sec-label,
  .hero-title,
  .hero-title-en,
  .hero-subtitle,
  .hero-meta {
    opacity: 0;
    transform: translateY(34px);
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .hero .sec-label   { transition-delay: 0.05s; }
  .hero-title        { transition-delay: 0.15s; }
  .hero-title-en     { transition-delay: 0.28s; }
  .hero-subtitle     { transition-delay: 0.38s; }
  .hero-meta         { transition-delay: 0.5s; }
  .hero.is-in .sec-label,
  .hero.is-in .hero-title,

// 3D 模型（懒加载：滚到区块附近才加载脚本 + 模型 + HDRI；失败/不支持时给提示）

  var ms = document.getElementById('modelSection');
  ms.style.display = '';

  var mvScriptLoaded = false;
  function loadModelViewer() {
    if (mvScriptLoaded) return;
    mvScriptLoaded = true;
    var mvScript = document.createElement('script');
    mvScript.type = 'module';
    mvScript.src = 'https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js';
    mvScript.onload = function () {
      var mv = document.getElementById('projectModel');
      mv.addEventListener('error', function () { showModelFallback(); });
      mv.setAttribute('src', PROJECT.model.src);
    };
    mvScript.onerror = function () { showModelFallback(); };
    document.head.appendChild(mvScript);
  }

  // 用户滚到区块附近（提前 400px）才开始加载
  var modelIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) {
        loadModelViewer();
        modelIO.disconnect();
      }
    });
  }, { rootMargin: '400px' });
  modelIO.observe(ms);

  function showModelFallback() {
    var box = document.getElementById('modelSection').querySelector('.model-wrap');
    if (!document.getElementById('modelFallback')) {
      var fb = document.createElement('div');
      fb.id = 'modelFallback';
      fb.style.cssText = 'display:flex;align-items:center;justify-content:center;height:70vh;min-height:420px;text-align:center;color:rgba(255,255,255,0.45);font-size:0.95rem;line-height:1.9;padding:2rem;';

// 视差（data-parallax 元素，数值为位移幅度 px）
(function(){
  var pxEls = Array.prototype.slice.call(document.querySelectorAll('[data-parallax]'));
  if (!pxEls.length) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ticking = false;
  function update(){
    var vh = window.innerHeight;
    pxEls.forEach(function(el){
      var host = el.closest('.full-bleed') || el.parentElement;
      var r = host.getBoundingClientRect();
      var p = (r.top + r.height / 2 - vh / 2) / vh;
      if (p > 1.4) p = 1.4; else if (p < -1.4) p = -1.4;
      var sp = parseFloat(el.getAttribute('data-parallax')) || 40;
      el.style.transform = 'translateY(' + (p * sp).toFixed(1) + 'px)';
    });
    ticking = false;
  }
  window.addEventListener('scroll', function(){
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }, { passive: true });
  update();
})();

// Lightbox 图片放大

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-zoom]');
  if (t) {
    var img = t.tagName === 'IMG' ? t : t.querySelector('img');
    if (img && img.src) {
      lightboxImg.src = img.src;
      lightbox.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
  } else if (lightbox.classList.contains('is-open') && e.target.closest('.lightbox')) {
    lightbox.classList.remove('is-open');
    document.body.style.overflow = '';
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && lightbox.classList.contains('is-open')) {
    lightbox.classList.remove('is-open');
    document.body.style.overflow = '';
  }
});
