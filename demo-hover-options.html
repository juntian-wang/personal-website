<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片 Hover 动画方案对比</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#f4efe6; font-family:'Inter',sans-serif; min-height:100vh;
    padding:50px 20px 90px; color:#3a352e;
  }
  .section-title { max-width:1080px; margin:0 auto 8px; font-size:20px; font-weight:800; }
  .section-sub { max-width:1080px; margin:0 auto 26px; font-size:13px; color:#8a8580; line-height:1.5; }
  .gallery {
    position:relative; width:100%; max-width:1080px; margin:0 auto 70px;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:52px 40px; padding:40px 0;
  }

  .card {
    --base:0deg; --rx:0deg; --ry:0deg; --ty:0px; --sc:1;
    position:relative; width:210px; background:#fffef9; border-radius:16px;
    padding:11px 11px 15px;
    box-shadow:0 1px 1px rgba(0,0,0,.04),0 6px 16px rgba(0,0,0,.07),0 22px 44px rgba(0,0,0,.05);
    transform: perspective(800px) translateY(var(--ty)) rotateX(var(--rx)) rotateY(var(--ry)) rotate(var(--base)) scale(var(--sc));
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .card:nth-child(1){--base:-7deg} .card:nth-child(2){--base:5deg}
  .card:nth-child(3){--base:-4deg} .card:nth-child(4){--base:6deg} .card:nth-child(5){--base:-3deg}
  .card:hover { box-shadow:0 1px 1px rgba(0,0,0,.04),0 12px 28px rgba(0,0,0,.1),0 34px 60px rgba(0,0,0,.08); z-index:100; }

  .photo-wrap { position:relative; aspect-ratio:4/3; }
  .photo-wrap img { width:100%; height:100%; object-fit:cover; display:block; border-radius:10px; transition:transform .4s ease; }

  .tape {
    position:absolute; top:-13px; left:27%; width:46%; height:24px;
    background:rgba(255,230,105,.82); transform:rotate(-3deg); transform-origin:center;
    box-shadow:0 1px 2px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.35); z-index:5; pointer-events:none;
  }
  .tape::before,.tape::after{content:'';position:absolute;top:2px;bottom:2px;width:0;border-left:1px dotted rgba(170,150,70,.45);}
  .tape::before{left:5px}.tape::after{right:5px}

  .label{
    position:absolute; top:-10px; right:-44px; background:#ffe86e; color:#c23a52;
    font-size:10px; font-weight:800; letter-spacing:.07em; padding:4px 8px; border-radius:4px;
    transform:rotate(9deg); transform-origin:top right; box-shadow:0 1px 2px rgba(0,0,0,.1);
    z-index:6; white-space:nowrap;
  }
  .card:nth-child(1) .label{transform:rotate(-14deg)} .card:nth-child(2) .label{transform:rotate(16deg)}
  .card:nth-child(3) .label{transform:rotate(-9deg)} .card:nth-child(4) .label{transform:rotate(12deg)}
  .card:nth-child(5) .label{transform:rotate(-15deg)}

  .batch{margin-top:11px;font-size:11px;color:#8a8580;letter-spacing:.02em;}

  /* ===== A: 3D follow tilt (JS-driven vars) ===== */
  .scheme-a .card { transition: transform .12s ease-out, box-shadow .3s ease; }
  .scheme-a .card:hover { --ty:-10px; --sc:1.03; }

  /* ===== B: straighten + lift ===== */
  .scheme-b .card:hover { --base:0deg; --ty:-12px; --sc:1.04; }

  /* ===== C: zoom + shine sweep ===== */
  .scheme-c .card:hover { --ty:-8px; --sc:1.02; }
  .scheme-c .card:hover img { transform: scale(1.08); }
  .scheme-c .photo-wrap::after{
    content:''; position:absolute; inset:0; border-radius:10px; z-index:3; pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);
    transform:translateX(-130%); transition:transform .7s ease;
  }
  .scheme-c .card:hover .photo-wrap::after{ transform:translateX(130%); }

  /* ===== D: label / tape react ===== */
  .scheme-d .card:hover { --ty:-8px; }
  .scheme-d .card:hover .label { top:-16px; }
  .scheme-d .card:hover .tape { transform: rotate(-7deg); }
</style>
</head>

const schemes = [
  {cls:'scheme-a', title:'方案 A · 鼠标跟随 3D 倾斜', sub:'移动鼠标，卡片像实体照片一样随光标转动（带轻微上浮）。需要一点点 JS。'},
  {cls:'scheme-b', title:'方案 B · 悬停转正 + 浮起', sub:'歪斜散落的卡片被“拿起来”摆正、上浮、阴影加深。纯 CSS。'},
  {cls:'scheme-c', title:'方案 C · 图片放大 + 光泽扫过', sub:'照片在卡片内轻微放大，同时一道高光从左扫到右。纯 CSS。'},
  {cls:'scheme-d', title:'方案 D · 标签 / 胶带微动', sub:'hover 时红色标签往上翘起、黄色胶带微微掀起。纯 CSS。'}
];

const root = document.getElementById('root');
schemes.forEach(s => {
  const h = document.createElement('h2'); h.className='section-title'; h.textContent=s.title;
  const p = document.createElement('p'); p.className='section-sub'; p.textContent=s.sub;
  const g = document.createElement('div'); g.className='gallery '+s.cls;
  IMAGES.forEach(img => {
    const a = document.createElement('article'); a.className='card';
    a.innerHTML = '<div class="tape"></div>'
      + '<div class="photo-wrap"><img src="'+img.src+'" alt="'+img.name+'">'
      + '<span class="label">'+img.label+'</span></div>'
      + '<p class="batch">'+img.name+'</p>';
    g.appendChild(a);
  });
  root.appendChild(h); root.appendChild(p); root.appendChild(g);
});

// Scheme A: tilt follows cursor
document.querySelectorAll('.scheme-a .card').forEach(card => {
  card.addEventListener('mousemove', e => {
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    card.style.setProperty('--ry', (px * 16) + 'deg');
    card.style.setProperty('--rx', (-py * 16) + 'deg');
  });
  card.addEventListener('mouseleave', () => {
    card.style.setProperty('--ry', '0deg');
    card.style.setProperty('--rx', '0deg');
  });
});
</script>
