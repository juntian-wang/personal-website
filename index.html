<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人网站</title>
  <style>
    /* ===== Reset ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
    }

    /* ===== Hero ===== */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Unicorn Studio container */
    .hero-scene {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-scene [data-us-project] {
      width: 100% !important;
      height: 100vh !important;
    }

    /* Loading placeholder */
    .hero-placeholder {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }
    .hero-placeholder .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Hero Background Image ===== */
    .hero-bg-image {
      position: absolute;
      inset: 0;
      z-index: -2;
      will-change: transform;
    }
    .hero-bg-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== Hero Background Text ===== */
    .hero-bg-text {
      position: absolute;
      inset: 0;
      z-index: -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero-bg-text .line-1 {
      font-size: 62px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0px;
    }
    .hero-bg-text .line-2 {
      font-size: 183px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 0;
    }
    /* ===== Scroll Video Section (replaces Page 2) ===== */
    .scroll-video {
      position: relative;
      width: 100%;
      background: #000;
    }
    .scroll-video-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    .scroll-video-loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    .scroll-video-loading.is-hidden {
      opacity: 0;
    }
    .scroll-video-loading .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: #888;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Progress bar at bottom */
    .scroll-video-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      height: 3px;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }
    .scroll-video-progress-bar {
      height: 100%;
      width: 0%;
      background: rgba(255,255,255,0.5);
      transition: width 0.1s linear;
    }

    /* ===== Video Text Overlays ===== */
    .scroll-text-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
    }
    .scroll-text-overlay h2 {
      font-size: clamp(1.5rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow: 0 2px 30px rgba(0,0,0,0.6);
      text-align: center;
      max-width: 85%;
      line-height: 1.3;
      margin: 0;
    }
    .scroll-text-overlay p {
      font-size: clamp(0.9rem, 2vw, 1.4rem);
      font-weight: 400;
      color: rgba(255,255,255,0.7);
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 75%;
      line-height: 1.6;
      margin: 0.8rem 0 0;
    }
    /* Position variants */
    .scroll-text-overlay.is-bottom {
      align-items: flex-end;
      padding-bottom: 12vh;
    }
    .scroll-text-overlay.is-top {
      align-items: flex-start;
      padding-top: 12vh;
    }
    .scroll-text-overlay.is-left {
      justify-content: flex-start;
      padding-left: 8vw;
    }
    .scroll-text-overlay.is-right {
      justify-content: flex-end;
      padding-right: 8vw;
    }
    .scroll-text-overlay .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .scroll-text-overlay.is-left .text-group,
    .scroll-text-overlay.is-right .text-group {
      align-items: flex-start;
    }

    /* Reduced motion: pause at first frame */
    @media (prefers-reduced-motion: reduce) {
      .scroll-video-loading {
        opacity: 0;
        transition: none;
      }
    }

    /* ===== Portfolio ===== */
    .portfolio {
      position: relative;
      width: 100%;
      padding: 0 2rem 6rem;
      background: #000;
      overflow-x: hidden;
    }
    .portfolio-top-img-wrap {
      width: 100vw;
      overflow: hidden;
      height: 38vw;
    }
    .portfolio-top-img {
      display: block;
      width: 100%;
      height: auto;
    }
    .portfolio-inner {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      z-index: 1;
    }
    .portfolio-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      margin-bottom: 0.5rem;
    }
    .portfolio-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 3rem;
    }
    /* ===== Portfolio Gallery (Coverflow) ===== */
    .portfolio-gallery {
      position: relative;
      width: 100%;
      height: 460px;
      margin-top: -5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .portfolio-track {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .portfolio-item {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(440px, 74vw);
      aspect-ratio: 4 / 3;
      margin: 0;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      display: block;
      text-decoration: none;
      color: inherit;
      transform: translate(-50%, -50%) translateX(var(--tx, 0px)) scale(var(--scale, 1)) rotateY(var(--rot, 0deg));
      transition: border-color .3s ease;
      will-change: transform, opacity;
      --tx: 0px;
      --scale: 1;
      --rot: 0deg;
    }
    .portfolio-item.is-active {
      border-color: rgba(255,255,255,0.22);
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.85);
      cursor: pointer;
    }
    .portfolio-item:not(.is-active):hover {
      border-color: rgba(255,255,255,0.18);
    }
    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .portfolio-item .info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.2rem;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      pointer-events: none;
    }
    .portfolio-item .info h3 {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .portfolio-item .info p {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.45);
      margin-top: 0.2rem;
    }

    /* Nav arrows */
    .pg-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 200;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(20,20,20,0.6);
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: background .25s ease, border-color .25s ease;
    }
    .pg-nav:hover {
      background: rgba(40,40,40,0.8);
      border-color: rgba(255,255,255,0.4);
    }
    .pg-prev { left: 0; }
    .pg-next { right: 0; }
    .pg-nav:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    /* Dots */
    @media (max-width: 640px) {
      .portfolio-gallery { height: 380px; }
      .pg-nav { width: 38px; height: 38px; font-size: 1.2rem; }
    }

    /* ===== Thanks Section ===== */
    .thanks {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .thanks-scene {

      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }
    .thanks-scene [data-us-project] {
      width: 100vw !important;
      height: 100vh !important;
    }
    .thanks-scene canvas {
      width: 100vw !important;
      height: 100vh !important;
    }
    .thanks-placeholder {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }

    /* ===== Loading Screen (user's cyberpunk style) ===== */
    :root {
      --loader-primary: #00f3ff;
      --loader-bg: #050505;
    }
    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    #loader-wrapper.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Background grid */
    #loader-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,243,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,243,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Core loading ring */
    .loader-ring {
      position: relative;
      width: 150px;
      height: 150px;
    }
    .loader-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .circle-bg {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 4;
    }
    .circle-progress {
      fill: none;
      stroke: var(--loader-primary);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      filter: drop-shadow(0 0 8px var(--loader-primary));
      transition: stroke-dashoffset 0.1s linear;
    }

    /* Decorative spinning rings */
    .spinner-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      margin-top: -60px;
      margin-left: -60px;
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 50%;
      animation: loaderSpin 4s linear infinite;
    }
    .spinner-outer {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 180px;
      height: 180px;
      margin-top: -90px;
      margin-left: -90px;
      border: 1px solid rgba(0,243,255,0.1);
      border-radius: 50%;
      animation: loaderSpinReverse 10s linear infinite;
    }
    .core-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      background: var(--loader-primary);
      border-radius: 50%;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 15px var(--loader-primary), 0 0 30px var(--loader-primary);
      animation: loaderPulse 1s ease-in-out infinite;
    }

    /* Text */
    .loading-text {
      margin-top: 40px;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
    }
    .loader-percentage {
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 10px var(--loader-primary);
    }
    .loader-status {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.6);
      margin-top: 5px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes loaderSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes loaderSpinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes loaderPulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%,-50%) scale(1.5); opacity: 0.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner-inner, .spinner-outer { animation: none; }
      .core-dot { animation: none; }
    }
  </style>

  <!-- ===== Loading Screen (cyberpunk style) ===== -->
  <div id="loader-wrapper">

      <div class="spinner-inner"></div>
      <div class="core-dot"></div>
      <svg class="loader-svg" viewBox="0 0 160 160">
        <circle class="circle-bg" cx="80" cy="80" r="70"></circle>
        <circle id="progress-ring" class="circle-progress" cx="80" cy="80" r="70"></circle>
      </svg>
    </div>

    <!-- Loading text -->
    <div class="loading-text">
      <div class="loader-percentage" id="loader-percentage">0%</div>
      <div class="loader-status" id="loader-status">INITIALIZING...</div>
    </div>
  </div>

  <!-- Loading screen JS: track real frame progress -->
  <script>
    (function(){
      var wrapper = document.getElementById('loader-wrapper');
      var ring    = document.getElementById('progress-ring');
      var pctEl   = document.getElementById('loader-percentage');
      var statusEl= document.getElementById('loader-status');

      // Lock scroll
      document.body.style.overflow = 'hidden';

      // SVG ring perimeter
      var radius = 70;
      var circumference = 2 * Math.PI * radius;
      ring.style.strokeDasharray = circumference + ' ' + circumference;
      ring.style.strokeDashoffset = circumference;

      var statusMsgs = [
        [0, 15, '初始化...'],
        [15, 35, '正在加载...'],
        [35, 55, '加载中...'],
        [55, 75, '快了...'],
        [75, 99, '马上就好...'],
        [100, 100, '✓ 搞定']
      ];

      function setProgress(pct) {
        var offset = circumference - (pct / 100) * circumference;
        ring.style.strokeDashoffset = offset;
        pctEl.textContent = Math.round(pct) + '%';

        for (var i = 0; i < statusMsgs.length; i++) {
          if (pct >= statusMsgs[i][0] && pct <= statusMsgs[i][1]) {
            statusEl.textContent = statusMsgs[i][2];
            break;
          }
        }
      }

      // Poll frame loading progress
      var tick = setInterval(function(){
        var p = window._frameLoadProgress;
        if (p !== undefined) {
          var pct = Math.min(p * 100, 100);
          setProgress(pct);
          if (p >= 1) {
            clearInterval(tick);
            statusEl.textContent = '✓ 搞定';
            pctEl.textContent = '100%';
            setProgress(100);
            setTimeout(function(){
              wrapper.classList.add('is-hidden');
              document.body.style.overflow = '';
            }, 600);
          }
        }
      }, 100);

      // Safety: dismiss after 20s max
      setTimeout(function(){
        if (!wrapper.classList.contains('is-hidden')) {
          clearInterval(tick);
          setProgress(100);
          statusEl.textContent = '✓ 搞定';
          setTimeout(function(){
            wrapper.classList.add('is-hidden');
            document.body.style.overflow = '';
          }, 600);
        }
      }, 20000);
    })();
  </script>

  <script>
    // ===== Multi-layer Parallax =====
    // Background: 0.3x speed (slowest), Text: 0.6x, Scene: 1.0x (normal)
    (function(){
      var bg  = document.querySelector('.hero-bg-image');
      var txt = document.querySelector('.hero-bg-text');
      var l1  = document.querySelector('.line-1');
      var l2  = document.querySelector('.line-2');
      var ticking = false;

      function updateParallax() {
        var sy = window.scrollY;
        var maxScroll = window.innerHeight;

        // Background: 0.3x speed → counter 70%
        var bgOffset = Math.min(sy, maxScroll) * 0.7;
        bg.style.transform = 'translateY(' + bgOffset + 'px)';

        // Text container: no vertical transform (moved to individual lines)
        txt.style.transform = 'none';

        // Line 1 "Hi there": 0.55x speed → counter 45%, plus base -107px + translateX(-362px)
        var l1y = -107 + Math.min(sy, maxScroll) * 0.45;
        l1.style.transform = 'translateX(-362px) translateY(' + l1y + 'px)';

        // Line 2 "I am Jon": 0.65x speed → counter 35%, plus base -107px + translateX(-146px)
        var l2y = -107 + Math.min(sy, maxScroll) * 0.35;
        l2.style.transform = 'translateX(-146px) translateY(' + l2y + 'px)';

        ticking = false;
      }

      window.addEventListener('scroll', function() {
        if (!ticking) {
          window.requestAnimationFrame(updateParallax);
          ticking = true;
        }
      });

      // Set initial state
      updateParallax();
    })();
  </script>

  <script>
    // ===== Scroll-Driven Canvas Image Sequence (Page 2) =====
    // Preloads all 361 frames as WebP images, draws to canvas based on scroll.
    // No network requests after preload = instant frame switching.
    (function(){
      var TOTAL_FRAMES = 361;
      var FRAME_W      = 1920;
      var FRAME_H      = 1080;
      var FRAME_DIR    = 'pic/frames/';
      var DURATION     = 15; // seconds

      var section     = document.getElementById('scrollVideo');
      var canvas      = document.getElementById('scrollCanvas');
      var ctx         = canvas.getContext('2d');
      var loading     = document.getElementById('scrollVideoLoading');
      var loadingTxt  = document.getElementById('loadingProgress');
      var progBar     = document.getElementById('scrollVideoProgressBar');

      // Retina support
      var dpr = window.devicePixelRatio || 1;
      canvas.width  = FRAME_W * dpr;
      canvas.height = FRAME_H * dpr;
      ctx.scale(dpr, dpr);

      // ===== Preload all 361 frames =====
      var images   = [];
      var loaded   = 0;
      var isReady  = false;

      function preloadAll() {
        for (var i = 0; i < TOTAL_FRAMES; i++) {
          (function(idx){
            var img = new Image();
            var num = String(idx + 1).padStart(4, '0');
            img.src = FRAME_DIR + 'frame-' + num + '.webp';
            img.onload = img.onerror = function(){
              loaded++;
              window._frameLoadProgress = loaded / TOTAL_FRAMES;
              images[idx] = img;
              if (loadingTxt) {
                loadingTxt.textContent = (loaded < TOTAL_FRAMES)
                  ? '加载中 ' + loaded + '/' + TOTAL_FRAMES
                  : '✓ 已就绪';
              }
              // Progressive: enable scrolling as soon as frame 0 is available
              if (!isReady && images[0]) {
                isReady = true;
                loading.classList.add('is-hidden');
                drawFrame(0);
                updateTextOverlays(0);
              }
            };
            images[idx] = null;
          })(i);
        }
      }

      // ===== Draw frame with object-fit:cover =====
      var currentFrame = -1;

      function drawFrame(frameIdx) {
        if (frameIdx === currentFrame) return;
        currentFrame = frameIdx;
        var img = images[frameIdx];
        if (!img) return;

        ctx.clearRect(0, 0, FRAME_W, FRAME_H);

        // Cover-fit: source image (1920x1080) → canvas client area
        var cw = canvas.clientWidth || window.innerWidth;
        var ch = canvas.clientHeight || window.innerHeight;
        var ca = cw / ch;
        var ia = FRAME_W / FRAME_H;
        var sx, sy, sw, sh;
        if (ca > ia) {
          sw = FRAME_H * ca;
          sh = FRAME_H;
          sx = (FRAME_W - sw) / 2;
          sy = 0;
        } else {
          sw = FRAME_W;
          sh = FRAME_W / ca;
          sx = 0;
          sy = (FRAME_H - sh) / 2;
        }
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, FRAME_W, FRAME_H);
      }

      // ===== Scroll-driven frame selection =====
      var scrollTicking = false;

      function onScroll() {
        if (scrollTicking || !isReady) return;
        scrollTicking = true;
        requestAnimationFrame(function(){
          var rect = section.getBoundingClientRect();
          var vh = window.innerHeight;
          var travel = section.offsetHeight - vh;
          if (travel <= 0) { scrollTicking = false; return; }
          var p = Math.max(0, Math.min(1, -rect.top / travel));

          var frameIdx = Math.round(p * (TOTAL_FRAMES - 1));
          drawFrame(frameIdx);

          progBar.style.width = (p * 100) + '%';

          var t = (frameIdx / TOTAL_FRAMES) * DURATION;
          updateTextOverlays(t);

          scrollTicking = false;
        });
      }

      // ===== Text overlays (receives time param, no longer reads video.currentTime) =====
      var textOverlays = null;
      function updateTextOverlays(t) {
        if (textOverlays === null) {
          textOverlays = document.querySelectorAll('.scroll-text-overlay');
        }
        for (var i = 0; i < textOverlays.length; i++) {
          var el = textOverlays[i];
          var start = parseFloat(el.dataset.start);
          var end   = parseFloat(el.dataset.end);
          var fade  = parseFloat(el.dataset.fade) || 0.3;
          var opacity = 0;
          if (t >= start && t <= end) {
            opacity = 1;
            if (t - start < fade) opacity = (t - start) / fade;
            if (end - t < fade) opacity = (end - t) / fade;
          }
          el.style.opacity = opacity;
        }
      }

      // ===== Init =====
      function resize() {
        section.style.height = (window.innerHeight * 5) + 'px';
      }

      resize();
      preloadAll();

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', resize);

      updateTextOverlays(0);
    })();
  </script>

  <script>
    // ===== Portfolio Coverflow Gallery (looping, center-enlarged) =====
    (function () {
      var gallery = document.getElementById('portfolioGallery');
      if (!gallery) return;
      var items = Array.prototype.slice.call(gallery.querySelectorAll('.portfolio-item'));
      var n = items.length;
      if (n === 0) return;
      // 默认让中间那一项放大（3 项时即第 2 项）
      var active = Math.floor(n / 2);
      if (active >= n) active = 0;

      // 根据容器宽度自适应两侧偏移量
      function getGap() {
        var cardW = Math.min(440, (gallery.clientWidth || window.innerWidth) * 0.74);
        return Math.max(cardW * 0.95, 180);
      }

      function setActive(i) {
        active = ((i % n) + n) % n;   // 取模实现首尾循环
        var gap = getGap();
        items.forEach(function (el, idx) {
          // 计算相对当前项的偏移，并归一化到最近距离以实现循环
          var off = idx - active;
          if (off > n / 2) off -= n;
          if (off < -n / 2) off += n;
          var abs = Math.abs(off);
          var scale = abs === 0 ? 1 : (abs === 1 ? 0.78 : 0.55);
          var rot = off === 0 ? 0 : (off < 0 ? 28 : -28);
          el.style.setProperty('--tx', (off * gap) + 'px');
          el.style.setProperty('--scale', scale);
          el.style.setProperty('--rot', rot + 'deg');
          el.style.zIndex = String(100 - abs);
          el.style.opacity = abs > 2 ? '0.15' : (abs === 0 ? '1' : (abs === 1 ? '0.85' : '0.5'));
          el.style.filter = 'none';
          var isActive = off === 0;
          el.classList.toggle('is-active', isActive);
          el.setAttribute('aria-hidden', isActive ? 'false' : 'true');
          el.tabIndex = isActive ? 0 : -1;
        });
      }

      // 点击非中间卡片：切换居中，不触发链接跳转
      items.forEach(function (el, idx) {
        el.addEventListener('click', function (e) {
          if (!el.classList.contains('is-active')) {
            e.preventDefault();
            setActive(idx);
          }
        });
      });

      document.getElementById('pgPrev').addEventListener('click', function () { setActive(active - 1); });
      document.getElementById('pgNext').addEventListener('click', function () { setActive(active + 1); });

      // 键盘左右切换（无障碍）
      gallery.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); setActive(active - 1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); setActive(active + 1); }
      });

      // 尺寸变化时重算偏移
      var rt;
      window.addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(function () { setActive(active); }, 120);
      });

      // ===== 持续缓慢漂移动画（所有卡片一直平滑移动） =====
      var SPEED = 0.002;          // 每帧推进量，完成一次完整循环约 33 秒
      var autoProgress = active;  // 连续浮点值，范围 0~n
      var isAnimating = true;
      var isPaused = false;       // 鼠标悬停/触摸时暂停推进
      var isSnapping = false;     // 是否正在快速滑向目标
      var targetProgress = null;  // 点击后的目标位置

      function updateGallery(noAdvance) {
        if (!isAnimating) return;

        // 快速滑向目标（不受 isPaused 影响，点击后必须完成）
        if (isSnapping && targetProgress !== null) {
          var diff = targetProgress - autoProgress;
          while (diff > n / 2) diff -= n;
          while (diff < -n / 2) diff += n;
          if (Math.abs(diff) < 0.002) {
            autoProgress = targetProgress;
            isSnapping = false;
          } else {
            autoProgress += diff * 0.15;
            if (autoProgress >= n) autoProgress -= n;
            if (autoProgress < 0) autoProgress += n;
          }
        } else if (!noAdvance && !isPaused) {
          autoProgress += SPEED;
          if (autoProgress >= n) autoProgress -= n;
          if (autoProgress < 0) autoProgress += n;
        }

        var gap = getGap();
        var nearest = Math.round(autoProgress) % n;
        if (nearest < 0) nearest += n;

        items.forEach(function (el, idx) {
          var off = idx - autoProgress;
          if (off > n / 2) off -= n;
          if (off < -n / 2) off += n;

          var d = Math.abs(off);
          var scale = 1 - 0.45 * Math.min(d * 0.7, 1);
          var opacity = Math.max(0.7, 1 - Math.min(d * 0.5, 1));
          var filter = 'none';

          el.style.transform = 'translate(-50%,-50%) translateX(' + (off * gap) + 'px) scale(' + scale + ')';
          el.style.zIndex = String(Math.round(100 - d * 25));
          el.style.opacity = opacity;
          el.style.filter = filter;

          var isActive = d < 0.35;
          el.classList.toggle('is-active', isActive);
          el.setAttribute('aria-hidden', isActive ? 'false' : 'true');
          el.tabIndex = isActive ? 0 : -1;
        });

        if (isAnimating) requestAnimationFrame(function () { updateGallery(false); });
      }

      // 用户交互时快速平滑滑到目标（而非瞬间跳转）
      setActive = function (i) {
        active = (i % n + n) % n;
        targetProgress = active;
        isSnapping = true;
      };

      // 鼠标悬停在任意作品上时暂停推进，移出恢复
      var trackEl = document.getElementById('portfolioTrack');
      trackEl.addEventListener('mouseenter', function () { isPaused = true; });
      trackEl.addEventListener('mouseleave', function () { isPaused = false; });
      // 移动端触摸同理
      trackEl.addEventListener('touchstart', function () { isPaused = true; }, { passive: true });
      trackEl.addEventListener('touchend', function () { isPaused = false; }, { passive: true });

      // 启动持续动画
      updateGallery(false);
    })();
  </script>
